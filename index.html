<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Canvas Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="startGame()">

    <div id="gameContainer"></div>

    <div class="controls">

        <button onclick="moveright()">DESTRA</button><br>
        <button onclick="movedown()">GIU</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
